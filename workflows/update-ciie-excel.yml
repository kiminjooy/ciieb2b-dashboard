name: Update CIIE Excel data (manual)
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Excel parser
        run: python -m pip install openpyxl==3.1.5
      - name: Download latest Excel and update JSON
        env:
          ONEDRIVE_DOWNLOAD_URL: ${{ vars.ONEDRIVE_DOWNLOAD_URL }}
        run: python scripts/update_excel.py
      - name: Commit public data only
        run: |
          if git diff --quiet -- ciie-data.json; then echo 'No changes'; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ciie-data.json
          git commit -m 'Update CIIE public dashboard data'
          git push
