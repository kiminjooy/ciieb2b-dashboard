function surveyCompaniesFor(b){const found=new Map();for(const r of surveyRows()){if(getBuyer(r[1])?.code!==b.code)continue;const raw=String(r[2]||'').trim();if(!raw)continue;const id=companyIdentity(raw);if(!found.has(id))found.set(id,{raw,company:getCompany(raw)});}return found;}
function publicStatus(){const buyers={};for(const b of db.buyers){const meetings={};const found=surveyCompaniesFor(b);for(const {raw,company:c} of found.values()){const keys=[raw,...(c?[c.cn,c.name]:[])].filter(Boolean);for(const key of keys)meetings[key]={survey:'submitted'};}buyers[b.code]={allowance:b.allowance==='수령 완료'?'received':'pending',completedCount:found.size,meetings};}return {updated:new Date().toISOString(),buyers};}

async function publishBuyerStatus(){if(!gh.token){showSyncStatus('⚠️ GitHub 토큰 미연결');return;}if(publicPublishBusy){publicPublishPending=true;return;}publicPublishBusy=true;try{const url='https://api.github.com/repos/'+encodeURIComponent(gh.owner)+'/ciieb2b-dashboard/contents/buyer-status.json';const headers={'Authorization':'Bearer '+gh.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};const old=await fetch(url,{headers,cache:'no-store'});let sha=null;if(old.ok){sha=(await old.json()).sha;}else if(old.status!==404)throw Error('public repo HTTP '+old.status);const body={message:'Update public buyer progress (no personal contact details)',content:encode64(JSON.stringify(publicStatus())),...(sha?{sha}:{})};const res=await fetch(url,{method:'PUT',headers:{...headers,'Content-Type':'application/json'},body:JSON.stringify(body)});if(!res.ok)throw Error('HTTP '+res.status+' (토큰에 ciieb2b-dashboard Contents 쓰기 권한이 있는지 확인)');showSyncStatus('✓ buyer-status.json 게시 완료 · GitHub Pages 반영 대기');}catch(e){showSyncStatus('⚠️ 바이어 상태 게시 실패: '+e.message);alert('바이어 상태 게시 실패: '+e.message+'\nGitHub 토큰의 ciieb2b-dashboard 저장소 Contents 권한을 확인하세요.');}finally{publicPublishBusy=false;if(publicPublishPending){publicPublishPending=false;setTimeout(publishBuyerStatus,800)}}}
function queuePush(){if(!gh.token)return;clearTimeout(syncTimer);syncTimer=setTimeout(()=>pushGithub(),700);}
async function pushGithub(){if(!gh.token||syncing||!dirty)return;syncing=true;clearTimeout(syncTimer);showSyncStatus('GitHub에 저장 중...');const snapshot=JSON.stringify(db);try{const latest=await ghRequest('GET');const latestSha=latest?.sha||null;if(gh.sha!==null&&latestSha!==gh.sha){syncError='다른 기기에서 먼저 수정했습니다. 새로고침 전 변경 내용을 확인해 주세요.';showSyncStatus('⚠️ 동시 수정 충돌 · 저장 중지');return;}
const result=await ghRequest('PUT',{message:'Update private CIIE admin data',content:encode64(snapshot),...(latestSha?{sha:latestSha}:{})});gh.sha=result.content.sha;if(JSON.stringify(db)===snapshot)dirty=false;syncError='';showSyncStatus('✓ GitHub 공유 저장 완료');publishBuyerStatus();if(dirty)queuePush();}catch(e){syncError=e.message;showSyncStatus('⚠️ 공유 저장 실패: '+e.message)}finally{syncing=false;}}
async function pullGithub(force=false){if(!gh.token||syncing)return;if(dirty&&!force){showSyncStatus('⚠️ 로컬 변경 미동기화 · 원격 갱신 보류');return;}if(sheetDraft&&!force)return;try{const previousSha=gh.sha;const remote=await fetchRemote();if(remote){if(previousSha===gh.sha&&!force)return;db=remote;dirty=false;localStorage.setItem(STORE,JSON.stringify(db));if(!document.getElementById('modal'))render();showSyncStatus('✓ GitHub 최신 데이터 반영');}}catch(e){showSyncStatus('조회 실패: '+e.message)}}
function startPolling(){clearInterval(pollTimer);pollTimer=setInterval(()=>pullGithub(),15000)}
function disconnectGithub(){clearInterval(pollTimer);clearTimeout(syncTimer);localStorage.removeItem('ciie_gh_owner');localStorage.removeItem('ciie_gh_repo');localStorage.removeItem('ciie_gh_token');gh={owner:'',repo:'',token:'',sha:null};render()}
function syncPanel(){return `<details class="sync-mini" id="syncDetails"><summary title="GitHub 데이터 동기화 설정">☁️ 동기화 ${gh.token?'✓':'⚠'}</summary><div class="sync-pop"><div class="flex" style="justify-content:space-between;margin-bottom:12px"><strong>🔐 GitHub 데이터 동기화</strong><span id="syncState" class="sync-state">${gh.token?'연결됨 · 15초마다 변경 확인':'미연결 · 현재 브라우저에만 저장'}</span></div>${gh.token?`<div class="flex"><span class="pill">${escapeHtml(gh.owner+'/'+gh.repo)}</span><button class="btn small" onclick="pullGithub(true)">최신 데이터 가져오기</button><button class="btn small primary" onclick="dirty=true;pushGithub()">지금 공유 저장</button><button class="btn small" onclick="publishBuyerStatus()">바이어 현황 갱신</button><button class="btn small" onclick="disconnectGithub()">연결 해제</button></div>`:`<p class="muted">Private 저장소 연결은 관리자 전용 기기에서만 사용하세요. 연결하면 변경 사항은 자동 저장됩니다.</p><div class="flex"><input class="field" id="ghOwner" placeholder="GitHub 계정명" value="${escapeHtml(gh.owner)}" style="width:140px"><input class="field" id="ghRepo" placeholder="Private 저장소" value="${escapeHtml(gh.repo)}" style="width:160px"><input class="field" id="ghToken" type="password" placeholder="Fine-grained token" style="flex:1;min-width:150px!important"><button class="btn primary" onclick="connectGithub()">연결 · 동기화</button></div>`}<p class="muted" style="margin:12px 0 0;font-size:11px">바이어 연동을 위해 토큰에 ciieb2b-dashboard 저장소 Contents 쓰기 권한도 필요합니다. 공개 파일에는 바이어 코드별 설문 완료 및 수령 상태만 저장됩니다. 관리자 코드는 화면 구분용이며 실제 데이터 접근은 GitHub 토큰 권한으로 제어됩니다.</p></div></details>`;}

function saveContact(){const b=db.buyers.find(x=>x.code===modalCode);if(b){b.contact=$('#contactMemo').value;save()}$('#modal').remove()}
const configs={responses:{label:'Sheet1 · 설문 결과',heads:['完成时间 · 완료 시간','贵公司名称','洽谈的韩国企业名称','本次洽谈满意度','洽谈评价及意见（选填）'],cols:5,rows:()=>db.responses},buyers:{label:'바이어 · 9개 열',heads:['코드','바이어사명 (영문)','바이어사명 (중문)','지역','담당자명 (중문)','담당자명 (영문)','직위','휴대폰번호','이메일주소'],cols:9,rows:()=>db.buyers.map(b=>[b.code,b.name,b.cn,b.city||'',b.contactNameCn||b.contactName||'',b.contactNameEn||'',b.position||'',b.phone||'',b.email||''])},companies:{label:'국내기업 · A:E',heads:['전시관','부스번호','기업명 (한)','기업명 (중)','카테고리'],cols:5,rows:()=>db.companies.map(c=>[c.hall,c.booth,c.name,c.cn,c.category||''])}};
function sheet(){if(!sheetDraft||sheetDraft.key!==sheetTab)sheetDraft={key:sheetTab,rows:configs[sheetTab].rows().map(r=>[...r])};const cfg=configs[sheetTab];$('#content').innerHTML=`<div class="card"><div class="flex" style="margin-bottom:16px"><h3 class="section-title" style="margin:0">Excel 데이터 관리</h3><span class="pill">SUPER ADMIN ONLY</span></div><div class="toolbar">${[['responses','설문 결과'],['buyers','바이어'],['companies','국내기업']].map(([k,n])=>`<button class="btn ${sheetTab===k?'primary':''}" onclick="sheetTab='${k}';sheetDraft=null;render()">${n}</button>`).join('')}</div><div class="hint">${cfg.label} — Excel에서 셀 범위를 복사한 뒤 아래 표의 첫 번째 셀을 클릭하고 Ctrl+V 하세요. 여러 행·열이 한 번에 입력됩니다. 설문 결과는 Excel의 <b>완료 시간~의견</b> 7개 열을 통째로 복사해 붙여넣을 수 있습니다. 불필요한 전자 메일·이름 열은 자동 제외됩니다. 기존 데이터를 완전히 교체하려면 <b>표 초기화</b> 후 붙여넣으세요.</div><div class="toolbar" style="margin-top:16px"><button class="btn" onclick="addRow()">+ 행 추가</button><button class="btn danger" onclick="clearSheet()">표 초기화</button><span class="muted" id="sheetCount"></span><span class="muted" id="pasteResult"></span><button class="btn primary right" onclick="commitSheet()">이 시트 저장</button></div><div class="tablewrap" style="max-height:440px"><table class="sheet"><thead><tr><th>#</th>${cfg.heads.map(h=>`<th>${escapeHtml(h)}</th>`).join('')}</tr></thead><tbody id="sheetBody"></tbody></table></div><p class="muted">※ GitHub 연결 시 저장된 Excel 데이터가 관리자 간 동기화됩니다. 바이어 대시보드는 아직 연결되지 않았습니다. 개인정보는 공개 GitHub 파일에 저장하지 마세요.</p></div>`;drawSheet()}
function drawSheet(){const cfg=configs[sheetTab];const rows=sheetDraft.rows;const count=Math.max(rows.length+1,6);$('#sheetCount').textContent=`${rows.length}개 행`;$('#sheetBody').innerHTML=Array.from({length:count},(_,i)=>`<tr><th>${i+1}</th>${cfg.heads.map((_,j)=>`<td><input data-r="${i}" data-c="${j}" value="${escapeHtml(rows[i]?.[j]??'')}" oninput="editCell(this)" onpaste="pasteCells(event,this)"></td>`).join('')}</tr>`).join('')}
function editCell(el){const r=+el.dataset.r,c=+el.dataset.c;while(sheetDraft.rows.length<=r)sheetDraft.rows.push(Array(configs[sheetTab].cols).fill(''));sheetDraft.rows[r][c]=el.value}
function pasteCells(e,el){
 const str=e.clipboardData?.getData('text/plain');if(!str||(!str.includes('\t')&&!str.includes('\n')))return;
 e.preventDefault();const lines=str.replace(/\r/g,'').replace(/\n$/,'').split('\n');
 const r=+el.dataset.r,c=+el.dataset.c,cols=configs[sheetTab].cols;
 const fullSurvey=sheetTab==='responses'&&lines.some(line=>line.split('\t').length>=7);
 let pasted=0,skippedHeader=0;
 lines.forEach((line,i)=>{
   let values=line.split('\t');
   if(fullSurvey&&values.length>=7)values=[values[0],values[3],values[4],values[5],values[6]];
   if(sheetTab==='responses'&&/^(완료 시간|完成时间|Completion time|완료시간)$/i.test((values[0]||'').trim())){skippedHeader++;return}
   if(!values.some(v=>String(v).trim()))return;
   const dest=r+pasted;while(sheetDraft.rows.length<=dest)sheetDraft.rows.push(Array(cols).fill(''));
   values.forEach((value,j)=>{if(c+j<cols)sheetDraft.rows[dest][c+j]=value});pasted++;
 });
 drawSheet();msg='';const target=document.querySelector(`[data-r="${r}"][data-c="${c}"]`);target?.focus();
 const n=document.querySelector('#pasteResult');if(n)n.textContent=`${pasted}행 붙여넣기 완료${fullSurvey?' · 7개 열 중 5개 열 자동 추출':''}${skippedHeader?' · 헤더 제외':''}`;
}
function addRow(){sheetDraft.rows.push(Array(configs[sheetTab].cols).fill(''));drawSheet()}
function clearSheet(){if(confirm('현재 시트 입력값을 전부 비울까요? 저장 버튼을 누르기 전까지는 기존 데이터가 유지됩니다.')){sheetDraft.rows=[];drawSheet()}}
function commitSheet(){const rows=sheetDraft.rows.filter(r=>r.some(v=>String(v??'').trim())).map(r=>r.map(x=>String(x??'').trim()));if(sheetTab==='responses'){db.responses=rows.map(r=>[r[0]||'',r[1]||'',r[2]||'',r[3]||'',r[4]||'']);const bad=rows.filter(r=>!getBuyer(r[1])||!getCompany(r[2]));msg=`설문 ${rows.length}행 저장 완료${bad.length?' · 바이어/기업 미매칭 '+bad.length+'행 (원본 표기 확인 필요)':''}`}
else if(sheetTab==='buyers'){const old=new Map(db.buyers.map(b=>[b.code,b]));db.buyers=rows.filter(r=>r[0]).map(r=>({...old.get(r[0]),code:r[0],name:r[1],cn:r[2],city:r[3],contactNameCn:r[4],contactNameEn:r[5],position:r[6],phone:r[7],email:r[8],visitDate:old.get(r[0])?.visitDate||'',allowance:old.get(r[0])?.allowance||'미수령',allowanceDate:old.get(r[0])?.allowanceDate||''}));msg=`바이어 ${db.buyers.length}개사 저장 완료`}
else{db.companies=rows.map(r=>({hall:r[0],booth:r[1],name:r[2],cn:r[3],category:r[4]}));msg=`국내기업 ${rows.length}개사 저장 완료`}save();sheetDraft=null;render()}
function exportPage(){$('#content').innerHTML=`<div class="card"><h3 class="section-title">데이터 내보내기</h3><p class="hint">이 시제품은 브라우저 저장 방식입니다. 백업 파일을 내려받아 보관할 수 있지만 GitHub Pages의 다른 이용자에게 자동 전파되지는 않습니다.</p><div class="flex" style="margin-top:16px"><button class="btn primary" onclick="downloadData(false)">공개용 데이터 JSON 다운로드</button><button class="btn" onclick="downloadData(true)">관리자 전체 백업 JSON</button></div><p class="muted">전체 백업에는 입력한 개인정보가 포함될 수 있습니다. 공개 GitHub 저장소에 업로드하지 마세요.</p><div class="toolbar" style="margin-top:20px"><input type="file" id="restore" accept=".json,application/json"><button class="btn" onclick="restoreData()">백업 불러오기</button></div></div>`}
function downloadData(full){let out=full?db:{updated:db.updated,buyers:db.buyers.map(b=>({code:b.code,name:b.name,cn:b.cn,visitDate:b.visitDate,allowance:b.allowance,allowanceDate:b.allowanceDate})),companies:db.companies,responses:db.responses};let blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=full?'ciie-admin-private-backup.json':'ciie-public-data.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
async function restoreData(){const file=$('#restore').files[0];if(!file)return alert('파일을 선택해 주세요.');try{const parsed=JSON.parse(await file.text());if(!Array.isArray(parsed.buyers)||!Array.isArray(parsed.companies)||!Array.isArray(parsed.responses))throw Error('데이터 형식 불일치');if(confirm('현재 로컬 데이터를 백업 파일로 교체할까요?')){db=parsed;save();msg='백업 불러오기 완료';render()}}catch(e){alert('불러오기 실패: '+e.message)}}
if(gh.token){localStorage.setItem('ciie_gh_owner',gh.owner);localStorage.setItem('ciie_gh_repo',gh.repo);localStorage.setItem('ciie_gh_token',gh.token);}render();if(gh.token){startPolling();showSyncStatus('GitHub 연결 정보 복원됨 · 최신 데이터 가져오는 중');pullGithub();}
</script></body></html>
