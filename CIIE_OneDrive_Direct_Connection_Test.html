<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CIIE OneDrive 직접 연결 테스트</title><style>body{font-family:Arial,'Malgun Gothic',sans-serif;max-width:760px;margin:40px auto;padding:20px;color:#17243a}button{background:#1769d2;color:white;border:0;padding:14px 22px;border-radius:9px;cursor:pointer;font-size:16px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f6fa;padding:16px;border-radius:8px}small{color:#5c6675}</style></head><body><h2>OneDrive → GitHub Pages 직접 연결 테스트</h2><p>GitHub Pages에서 이 페이지를 열고 아래 버튼을 누르세요. Excel 데이터는 저장하거나 외부 서버로 전송하지 않습니다.</p><button id="test">연결 테스트 시작</button><pre id="result">아직 테스트하지 않았습니다.</pre><small>참고: 이 테스트는 브라우저에서 직접 다운로드할 수 있는지와 CORS 허용 여부를 확인합니다. Excel 시트 파싱 테스트는 아닙니다.</small><script>
const share='https://1drv.ms/x/c/94fa941a7b54aa77/IQACDYblmcrmSp5m7CKaXT6cAZlPkrRqMSW_Ey3AXg44iro';
const out=document.querySelector('#result');
function log(s){out.textContent+=s+'\n'}
async function attempt(url,label){log('\n['+label+'] '+url);try{let res=await fetch(url,{mode:'cors',cache:'no-store',redirect:'follow'});log('HTTP: '+res.status+' '+res.statusText);log('최종 URL: '+res.url);log('Content-Type: '+(res.headers.get('content-type')||'(없음)'));if(!res.ok){log('결과: HTTP 오류');return}let blob=await res.blob();let head=new Uint8Array(await blob.slice(0,8).arrayBuffer());let hex=[...head].map(n=>n.toString(16).padStart(2,'0')).join(' ');log('크기: '+blob.size+' bytes');log('파일 시작 바이트: '+hex);if(head[0]===0x50&&head[1]===0x4b){log('✅ 성공: 브라우저에서 Excel(xlsx/ZIP 형식) 데이터를 직접 읽을 수 있습니다.')}else{log('⚠️ 요청은 성공했지만 Excel 파일은 아닙니다. HTML 로그인/미리보기 페이지일 수 있습니다.')}}catch(e){log('❌ 브라우저 직접 접근 실패: '+e.name+': '+e.message);log('CORS 차단, 네트워크 연결 또는 리디렉션 제한일 수 있습니다. 이 오류만으로 원인을 단정할 수 없습니다.')}}
document.querySelector('#test').onclick=async()=>{out.textContent='테스트 시작...\n';await attempt(share+'?download=1','다운로드 링크');await attempt(share,'공유 링크');log('\n테스트 종료. 결과 전체를 복사해서 ChatGPT에 보내주세요.');};
</script></body></html>
